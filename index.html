<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web de Prueba</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        button:hover {
            background: #764ba2;
        }
        #result {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 5px;
            min-height: 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Web de Prueba</h1>
        <p>Esta es una web de prueba creada rápidamente. Prueba los botones para interactuar.</p>

        <div class="button-group">
            <button onclick="saludar()">Saludar</button>
            <button onclick="mostrarHora()">Mostrar Hora</button>
            <button onclick="generarColor()">Color Aleatorio</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        function saludar() {
            document.getElementById('result').textContent = '¡Hola! 👋 Bienvenido a la web de prueba.';
        }

        function mostrarHora() {

        }

        function generarColor() {
            const color = '#' + Math.floor(Math.random()*16777215).toString(16);
            document.body.style.background = `linear-gradient(135deg, ${color} 0%, #764ba2 100%)`;
            document.getElementById('result').textContent = `Color: ${color}`;
        }
    </script>
</body>
</html>
